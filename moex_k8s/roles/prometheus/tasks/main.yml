# roles/prometheus/tasks/main.yml
---
- name: Create prometheus directories
  file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /opt/prometheus
    - /opt/prometheus/data

- name: Set correct ownership for prometheus data directory
  file:
    path: /opt/prometheus/data
    owner: nobody
    group: nogroup
    mode: "0755"

- name: Deploy prometheus config
  template:
    src: prometheus.yml.j2
    dest: /opt/prometheus/prometheus.yml
    owner: root
    group: root
    mode: "0644"
  notify: restart prometheus

- name: Ensure Prometheus container is running (create only if missing)
  shell: |
    docker inspect prometheus >/dev/null 2>&1 || {
      docker run -d \
        --name prometheus \
        --restart always \
        -p 9090:9090 \
        -v /opt/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro \
        -v /opt/prometheus/data:/prometheus \
        prom/prometheus:latest \
        --config.file=/etc/prometheus/prometheus.yml \
        --storage.tsdb.path=/prometheus \
        --web.enable-lifecycle \
        --web.enable-remote-write-receiver
    }
  changed_when: false
  ignore_errors: yes
