# roles/nginx/tasks/main.yml
---
- name: Create directory for nginx config
  file:
    path: /opt/nginx
    state: directory
    mode: '0755'

- name: Create SSL directory
  file:
    path: /opt/nginx/ssl
    state: directory
    mode: '0755'

- name: Generate SSL certificate
  shell: |
    openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
      -keyout /opt/nginx/ssl/server.key \
      -out /opt/nginx/ssl/server.crt \
      -subj "/C=RU/ST=Moscow/L=Moscow/O=Dev/CN={{ ansible_default_ipv4.address }}"
  args:
    creates: /opt/nginx/ssl/server.crt

- name: Deploy nginx configuration from template
  template:
    src: nginx.conf.j2
    dest: /opt/nginx/nginx.conf
    mode: '0644'
  notify: restart nginx

- name: Deploy index.html from template
  template:
    src: index.html.j2
    dest: /opt/nginx/index.html
    mode: '0644'

- name: Stop and remove existing nginx container if exists
  shell: |
    docker stop nginx 2>/dev/null || true
    docker rm nginx 2>/dev/null || true
  ignore_errors: yes
  changed_when: false

- name: Run nginx container with SSL
  shell: |
    docker run -d \
      --name nginx \
      --restart unless-stopped \
      -p 80:80 \
      -p 443:443 \
      -p 8081:8081 \
      --network mystand-app-net \
      -v /opt/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro \
      -v /opt/nginx/ssl:/etc/nginx/ssl:ro \
      -v /opt/nginx/index.html:/usr/share/nginx/html/index.html:ro \
      nginx:1.25-alpine
  register: docker_run
  changed_when: docker_run.rc == 0

- name: Wait for nginx to be ready
  wait_for:
    port: 80
    delay: 5
    timeout: 30
    host: "{{ ansible_default_ipv4.address }}"

- name: Test nginx health endpoint
  uri:
    url: "http://{{ ansible_default_ipv4.address }}/health"
    validate_certs: no
    return_content: yes
    status_code: 200
  register: health_check

- name: Display health check result
  debug:
    msg: "Nginx health check: {{ health_check.content }}"

- name: Display nginx status
  debug:
    msg: |
      ========================================
      ✅ Nginx successfully deployed!
      ========================================
      📍 Host: {{ ansible_default_ipv4.address }}
      🌐 URL:  http://{{ ansible_default_ipv4.address }}
      🏥 Health: http://{{ ansible_default_ipv4.address }}/health

      Test commands:
      curl http://{{ ansible_default_ipv4.address }}/
      curl http://{{ ansible_default_ipv4.address }}/health
      ========================================

- name: Save connection info
  copy:
    content: |
      Nginx deployed on k8s host
      Host: {{ ansible_default_ipv4.address }}
      URL: http://{{ ansible_default_ipv4.address }}
      Health: http://{{ ansible_default_ipv4.address }}/health
    dest: /opt/nginx/nginx-info.txt
    mode: '0644'
