# roles/docker_setup/tasks/main.yml
---
- name: Check if Docker is installed
  command: which docker
  register: docker_check
  failed_when: false
  changed_when: false
  ignore_errors: yes

- name: Remove old "app-net" network if exists
  shell: |
    docker network rm app-net 2>/dev/null || true
  register: network_remove
  changed_when: network_remove.rc == 0
  ignore_errors: yes

- name: Install Docker and dependencies
  block:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install Docker dependencies
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - python3-pip
          - software-properties-common
        state: present

    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Install Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Start and enable Docker
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Install Docker Python module
      pip:
        name:
          - docker
          - docker-compose
        state: present

    - name: Add user to docker group
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes
  when: docker_check.rc != 0

- name: Create "mystand-app-net" network
  shell: |
    docker network create mystand-app-net 2>/dev/null || true
  register: network_create
  changed_when: network_create.rc == 0
  ignore_errors: yes

- name: Display Docker status
  debug:
    msg: |
      ========================================
      ✅ Docker setup completed on {{ inventory_hostname }}
      ========================================
      📍 Host: {{ ansible_default_ipv4.address }}
      🐳 Docker version: {{ docker_version.stdout | default('installed') }}
      👤 User: {{ ansible_user }} in docker group: yes
      ========================================
  when: docker_check.rc != 0 or docker_version is defined
