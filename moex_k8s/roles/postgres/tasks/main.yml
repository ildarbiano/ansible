# roles/postgres/tasks/main.yml
---
- name: Create directories for PostgreSQL data
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /opt/postgres/data
    - /opt/postgres/init

- name: Create init SQL script (create database and user)
  template:
    src: init-db.sql.j2
    dest: /opt/postgres/init/init-db.sql
    mode: '0644'


- name: Stop and remove existing postgres container if exists
  shell: |
    docker stop postgres 2>/dev/null || true
    docker rm postgres 2>/dev/null || true
  ignore_errors: yes
  changed_when: false

- name: Run PostgreSQL container on port 5434
  shell: |
    docker run -d \
      --name postgres \
      --restart unless-stopped \
      -p 5434:5432 \
      --network mystand-app-net \
      -e POSTGRES_PASSWORD={{ postgres_password }} \
      -e POSTGRES_USER={{ postgres_user }} \
      -e POSTGRES_DB={{ postgres_db }} \
      -v /opt/postgres/data:/var/lib/postgresql/data \
      -v /opt/postgres/init:/docker-entrypoint-initdb.d \
      postgres:15-alpine
  register: docker_run
  changed_when: docker_run.rc == 0

- name: Wait for PostgreSQL to be ready
  wait_for:
    port: 5434
    delay: 10
    timeout: 60
    host: "{{ ansible_default_ipv4.address }}"

- name: Test database connection
  shell: |
    docker exec postgres psql -U {{ postgres_user }} -d {{ postgres_db }} -c "SELECT 1;"
  register: test_result
  changed_when: false

- name: Display PostgreSQL status
  debug:
    msg: |
      ========================================
      ✅ PostgreSQL successfully deployed!
      ========================================
      📍 Host: {{ ansible_default_ipv4.address }}
      🗄️ Database: {{ postgres_db }}
      👤 User: {{ postgres_user }}
      🔑 Password: {{ postgres_password }}
      🔌 Port: 5434
      
      Connection string:
      postgres://{{ postgres_user }}:{{ postgres_password }}@{{ ansible_default_ipv4.address }}:5434/{{ postgres_db }}
      ========================================

- name: Save connection info
  copy:
    content: |
      PostgreSQL deployed on pgs host
      Host: {{ ansible_default_ipv4.address }}
      Database: {{ postgres_db }}
      User: {{ postgres_user }}
      Password: {{ postgres_password }}
      Port: 5434
      Connection: postgres://{{ postgres_user }}:{{ postgres_password }}@{{ ansible_default_ipv4.address }}:5433/{{ postgres_db }}
    dest: /opt/postgres/postgres-info.txt
    mode: '0644'
