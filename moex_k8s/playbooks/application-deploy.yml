# playbooks/application-deploy.yml
---
- name: Deploy Java application
  hosts: k8s
  become: yes
  vars_files:
    - ../group_vars/dev/vault.yml
    - ../host_vars/pgs/vars.yml

  tasks:
    - name: Create application directory
      file:
        path: /opt/backend
        state: directory
        mode: '0755'

    - name: Copy ROOT.war
      copy:
        src: ../files/ROOT.war
        dest: /opt/backend/app.war
        mode: '0644'
        force: yes

    - name: Stop and remove existing backend container
      shell: |
        docker stop backend 2>/dev/null || true
        docker rm backend 2>/dev/null || true
      ignore_errors: yes
      changed_when: false

    - name: Run backend container
      shell: |
        docker run -d \
          --name backend \
          --restart unless-stopped \
          -p 8081:8081 \
          --network mystand-app-net \
          -v /opt/backend/app.war:/app.war \
          -e SPRING_DATASOURCE_URL=jdbc:postgresql://{{ static_ip }}:{{ postgres_port }}/{{ postgres_db }} \
          -e SPRING_DATASOURCE_USERNAME={{ postgres_user }} \
          -e SPRING_DATASOURCE_PASSWORD={{ vault_postgres_password }} \
          -e SERVER_PORT=8081 \
          eclipse-temurin:17-jre-alpine \
          java -jar /app.war
      register: docker_run
      changed_when: docker_run.rc == 0

    - name: Wait for backend to be ready
      wait_for:
        port: 8081
        delay: 15
        timeout: 120
        host: "{{ ansible_default_ipv4.address }}"

    - name: Test application health
      uri:
        url: "http://{{ ansible_default_ipv4.address }}:8081/api/health"
        status_code: 200
      register: health_check
      retries: 10
      delay: 10
      until: health_check.status == 200

    - name: Restart Nginx to update upstream
      shell: docker restart nginx
      ignore_errors: yes
      changed_when: false

    - name: Display deployment status
      debug:
        msg: |
          ========================================
          ✅ Application successfully deployed!
          ========================================
          📍 Host: {{ ansible_default_ipv4.address }}
          🔗 Health: http://{{ ansible_default_ipv4.address }}:8081/api/health
          📊 API: http://{{ ansible_default_ipv4.address }}:8081/api/data
          ========================================
